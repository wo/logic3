<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" type="text/css" href="logic3.css" /> 
    <script>
    MathJax = {
        tex: {
            tags: "ams",
            tagSide: "left",
            macros: {
                qed: "\\square",
                smallcaps: ["{\\scriptstyle \\text{#1}}", 1],
                dotminus: "\\mathbin{\\unicode{x2238}}",
                pconcat: "\\mathbin{\\stackrel{\\scriptscriptstyle p}{\\frown}}",
                pconcatseventeen: "\\mathbin{\\stackrel{\\scriptscriptstyle 17}{\\frown}}",
                gln: ["\\#[#1]", 1],
                gn: ["\\ulcorner #1 \\urcorner", 1],
                transt: ["\\widetilde{#1}^{\\,t}", 1]
            }
        },
        loader: {
            paths: { fonts: 'mathjax-fonts' }
        },
        output: {
            font: 'mathjax-stix2',
            displayAlign: 'left',
            displayIndent: '2em',
            lineleading: 0.6
        }
    };

    document.addEventListener('DOMContentLoaded', function() {
        const hamburger = document.querySelector('.hamburger');
        const dropdownContent = document.querySelector('.dropdown-content');
        hamburger.addEventListener('click', function() {
            dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', function(event) {
            if (!hamburger.contains(event.target)) {
                dropdownContent.style.display = 'none';
            }
        });
        // Prevent clicks inside the dropdown from closing it
        dropdownContent.addEventListener('click', function(event) {
            event.stopPropagation();
        });
    });
    </script>
    <script type="text/javascript" async="async" id="MathJax-script" src="mathjax/tex-chtml-nofont.js"></script>
</head>
<body>
    <header>
        <div id="title">
            <div class="dropdown">
                <span class="hamburger">&#9776;</span>
                <div class="dropdown-content">
                {{toc}}
                </div>
            </div>
            <a href="index.html">Logic, Computability, and Incompleteness</a>
        </div>
    </header>
    <div class="content">
    {{content}}
    </div>
    <footer>
        <p>
            © {{year}} Wolfgang Schwarz |
            <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">License</a> |
            <a href="https://github.com/wo/logic3">GitHub Source</a> |
            <a href="http://umsu.de/logic3/logic3.pdf">PDF Version</a>
        </p>
    </footer>
</body>
</html>
